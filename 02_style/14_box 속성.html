<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    span {
      background: yellow; 
      border: 1px dashed black;
    }
    div {
      background: orangered; margin: 20px; margin: 20px 0 0 0; margin: 10px 0;
      margin-top: 20px;
      padding: 20px;
      border: 1px double black;
      width: 200px;
      border-radius: 20px 0 0 20px; border-radius: 20px 0; border-radius: 20px;
    }
  </style>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=home" />
  <style>
    .logo {
      padding: 0;width: 100px; height: 100px;border-radius: 100px;
      border: 2px solid rgb(214, 203, 203);background: white; color: black;
      line-height: 96px; text-align: center;font-size: 25px;
      border-top: 0px solid white;border-bottom: 0px solid white;
    }
  </style>
</head>
<body>
  <h1>CSS의 box 속성</h1>
  <p>모든 태그는 사각형의 테두리를 가진다. </p>
  <a href="/"><span class="material-symbols-outlined">home</span></a>
  <hr>
  <span>span box</span>
  <div>div box</div>
  <p>정원을 만드세요</p>
  <div class="logo">Super</div>
  <br><br><br><br><br><br><br>
</body>

</html>
