<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    .btn {
      padding: 15px 30px; color: royalblue;
      font-size: 20pt; transition: all 0.3s ease; cursor: pointer;
    }
    .btn:hover {
      color: yellowgreen; transform: scale(2) rotate(360deg);
    }

    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }
  </style>
</head>

<body>
  <h1>css Animation 효과 주기 3</h1>
  <p>@keyframes, from {} to {} 활용 </p>
  <a href="/"><span class="material-symbols-outlined">home</span></a>
  <hr>
  <span class="material-icons icon btn">change_circle</span>
</body>

</html>
