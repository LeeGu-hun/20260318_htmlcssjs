<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    * {padding: 0; margin: 0; height: 100%;}
    body {
      background-image: url('/images/BackgroundFront.png'), url('/images/BackgroundBack.png');
      background-size: 50%;
      background-repeat: no-repeat;
      background-position: center left; /* 화면 크기를 기준으로 top, bottom, center, left, right */
      min-height: 100vh; /* 화면의 최소크기 지정 */ 
    }
  </style>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=home" />
</head>
<body>
  <h1>CSS의 background 속성</h1>
  <p></p>
  <a href="/"><span class="material-symbols-outlined">home</span>Home</a>
  <hr>

</body>

</html>
