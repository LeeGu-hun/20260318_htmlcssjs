<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join</title>
  <style>
    label {
      display: inline-block; width: 100px;
    }

    fieldset {
      padding: 10px;
      width: 300px;
      height: 270px;
    }
  </style>
</head>

<body>
  <form action="/" method="post" id="frm">
    <fieldset>
      <legend>회원가입</legend>
      <div>
        <label for="id">아이디</label>
        <input type="text" id="id" name="id" placeholder="아이디">
      </div>
      <div>
        <label for="pass">비밀번호</label>
        <input type="text" id="pass" name="pass" placeholder="비밀번호">
      </div>
      <div>
        <label for="repass">비밀번호 확인</label>
        <input type="text" id="repass" name="repass" placeholder="비밀번호 확인">
      </div>
      <div>
        <label for="name">이름</label>
        <input type="text" id="name" name="name" placeholder="이름을 입력해주세요">
      </div>
      <div>
        <label for="email">E-mail</label>
        <input type="email" name="email" id="email">
      </div>
      <div>
        <label>Mobile</label>
        <select id="tel1" style="width: 50px; display: inline-block;">
          <option value="">선택하세요</option>
          <option value="010" selected>010</option>
          <option value="011">011</option>
          <option value="016">016</option>
        </select> - 
        <input type="text" id="tel2" size="4" maxlength="4" style="width: 40px; display: inline-block;"> - 
        <input type="text" id="tel3" size="4" maxlength="4" style="width: 40px; display: inline-block;">
      </div>
      <div>
        <button type="submit" value="회원가입" id="join" name="join">회원가입</button>
        <button type="reset" value="가입취소" id="cancel" name="cancel">가입취소</button>
      </div>
    </fieldset>
  </form>
</body>

</html>
