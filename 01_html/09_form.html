<body>
  <h1>입력 양식 태그</h1>
  <a href="/"><span class="material-symbols-outlined">home</span>Home</a>

  <form action="index.html" method="post" enctype="">
    <fieldset>
    <legend>입력 양식 태그 종류</legend>
    <div>
      <label for="subject">번호</label>
      <input type="text" id="no" name="no" value="0001" readonly>
      <input type="hidden" name="key" value="awjsodkwnedmsuhna" readonly>
    </div>
    <div>
      <label for="subject">제목</label>
      <input type="text" id="subject" name="subject" required placeholder="제목을 입력">
    </div>
    <div>
      <label for="password">비밀번호</label>
      <input type="password" name="pw" id="password" placeholder="비밀번호를 입력하세요">
    </div>
    <div>
      <label for="female">여</label>
      <input type="radio" id="female" name="gender" value="여" checked>
      <label for="male">남</label>
      <input type="radio" id="male" name="gender" value="남">
    </div>
    <div>
      <label for="chk_hobby_game">게임</label>
      <input type="checkbox" name="hobby" id="chk_hobby_game" value="게임" checked>
      <label for="chk_hobby_chess">체스</label>
      <input type="checkbox" name="hobby" id="chk_hobby_chess" value="체스">
      <label>영화
      <input type="checkbox" name="hobby" id="chk_hobby_movie" value="영화"></label>
    </div>
    <div>
      <label for="email">E-mail</label>
      <input type="email" name="email" id="email" disabled>
    </div>
    <div>
      <label for="mobile">휴대폰</label>
      <select name="mobile" id="mobile">
        <option value="">선택하세요</option>
        <option value="010" selected>010</option>
        <option value="011">011</option>
      </select>
      <input type="number" name="mobile01" id="mobile01" maxlength="4"> - 
      <input type="text" name="mobile02" id="mobile02" maxlength="4">
    </div>
    <div>
      <label for="bigo">비고</label>
      <textarea name="bigo" id="bigo" rows="6"></textarea>
    </div>
    <div>
      <label for="startday">시작일</label>
      <input type="date" name="startday" id="startday">
      <input type="time" name="" id="">
    </div>
    <div>
      <input type="button" value="작성 button">
      <input type="submit" value="작성 submit" formaction="index.html">
      <button type="button">Button</button>
      <button type="reset">Reset</button>
      <button type="submit" formaction="01_text.html">Submit</button>
    </div>
