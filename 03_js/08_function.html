<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=home" />
  <style></style>
  <script></script>
</head>

<body>
  <h1>함수(function :: 같은 이름으로 여러개의 기능을 지정)</h1>
  <a href="/"><span class="material-symbols-outlined">home</span>Home</a>
  <hr>
  <p>함수는 처리의 집합된 단위, 궁극적 목적은 재사용</p>
  <ol>
    <li>함수의 선언</li>
    <script>
      fnc();
      function fnc() {
        console.log("fnc 원형함수입니다.")
      }
      console.log(fncVar) // undefined
      //fncVar();
      var fncVar = function () {
        console.log("fncVar 익명함수입니다.")
      }
    </script>
    <li>함수의 유형</li>
    <ul>
      <li>매개변수 X, 리턴 X</li>
      <script>
        function hello() {
          console.log("hello world")
          // return 없지만, 함수 내부적으로 return; 존재, 생략되어 있음.
        }
        var fncVar = function () {
          console.log("hello world")
        }
      </script>
      <li>매개변수 O, 리턴 X</li>
      <script>
        function hello(name) {
          console.log("hello " + name)
        }
        hello("소드 마스터 고길동")
        var fncVar = function (name) {
          console.log("hello " + name)
        }
        fncVar("둘리")
      </script>
      <li>매개변수 X, 리턴 O</li>
      <script>
        function hello() {
          return "hello world"
        }
        hello() // 리턴후 작동될 코드가 없음
        var tmp = hello() // 함수의 리턴값을 한번이상 사용할 경우 변수로 받는게 효율적
        console.log(tmp)
        console.log(hello()) // 리턴값을 한번만 사용할 경우 직접 매개변수로 적용

        var fncVar = function () {
          return "fncVar "
        }
        console.log(fncVar())
      </script>

      <li>매개변수 O, 리턴 O</li>
      <script>
        function hello(name) {
          return `hello ${name}`
        }
        hello("고길동") // 리턴후 작동될 코드가 없음
        var tmp = hello("고길동") // 함수의 리턴값을 한번이상 사용할 경우 변수로 받는게 효율적
        console.log(tmp)
        console.log(hello("고길동")) // 리턴값을 한번만 사용할 경우 직접 매개변수로 적용

        var fncVar = function (name) {
          return "hello " + name
        }
        console.log(fncVar("둘리"))
        var sum = function (a, b, c, d) { return a + b + c; } // 가능
        var sum = function (a, b, c) { return a + b + c + d; } // 에러

      </script>
    </ul>

    <li>매개변수에 따른 함수의 유형</li>
    <script>
      function myFnc(a, b) { // 매개변수에 var, let, const 사용불가
        console.log(a + b)
      }
      // console.log(a) // 매개변수는 함수 영역(scope)이기 때문에 외부에서 접근 불가
      myFnc(1, 1); myFnc(true, true); myFnc("hello", "world");
      myFnc(true, 1); myFnc([], 1); //[]와 문자열 +연산할 때 []는 ""(빈문자열)
      myFnc(1, 1, 1, 1, 1) // 정의된 매개변수의 갯수와 다를 때는 정의된 매개변수만 처리
      console.log("... : spread operator 전개 연산자")
      var arr1 = [1, 2]; var arr2 = [3, 4]
      var arr3 = [...arr1, ...arr2] //전개 연산자로 매개변수를 combined
      console.log(arr3)
      var sum = function (a, b, c) { return a + b + c + d; }
      console.log()
    </script>
  </ol>

</body>

</html>
