<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=home" />
  <style>
    table,
    th,
    td {
      border: 1px solid black;
      border-collapse: collapse;
      text-align: center;
    }
  </style>
  <script>
    // 출력하기 위한 방법
    console.log("hello world~!") // 개발자 도구의 console로 출력
    document.write("Hello World")// document에 출력
    //alert("hello world") // 알림창에서 출력

  </script>
</head>

<body>
  <h1>자바스크립트 변수의 타입</h1>
  <p>타입과 형변환</p>
  <a href="/"><span class="material-symbols-outlined">home</span>Home</a>
  <hr>
  <h3>변수의 타입</h3>
  <ol>
    <li>원시타입(Primitive Type)</li>
    <span>값 자체가 메모리에 직접 저장, 7가지</span>
    <ul type="disc">
      <li>number: 숫자(정수, 실수), Infinity</li>
      <script>
        var score = 100_000; grade = 9.5;
        console.log(score, typeof (score))
        console.log(grade, typeof (grade))
        console.log(Infinity, typeof (Infinity))
      </script>
      <li>bigint: 숫자인데 매우 큰 수</li>
      <script>
        var bigNumber = 1234567890_1234567890_1234567890_1234567890_1234567890_123456789n
        console.log(bigNumber, typeof (bigNumber))
      </script>
      <li>string: 문자열</li>
      <script>
        var str = "Hello World~!"
        console.log(str, typeof(str))
      </script>
      <li>boolean: true, false</li>
      <script>
        var isRight = true; var isCorrect = false;
        console.log(isRight, typeof(isRight))
        console.log(isCorrect, typeof(isCorrect))
      </script>
    </ul>

    <li>참조타입(Referenced Type)</li>
  </ol>

</body>

</html>
