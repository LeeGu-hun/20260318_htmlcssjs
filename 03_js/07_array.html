<head>

  <meta charset="UTF-8">

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=home" />

<body>
  <h1>배열(Array :: 같은 이름으로 여러개의 원소를 지정)</h1>
  <a href="/"><span class="material-symbols-outlined">home</span>Home</a>
  <hr>
  <p>배열은 원소에 접근할 때 index로 접근, 배열은 자체적으로 길이 값을 제공</p>
  <ol>
    <li>배열의 선언과 접근</li>
    <script>
      // 개별적으로 변수를 선언하기 매우 번거로움.
      const scoreCy = 100; const scoreMs = 100; const scoreJw = 100;

      // 하나의 이름으로 여러개의 값을 담을 수 있음.
      let scores = [88,74,92, 64, 100, 99]
      let tot = 0;
      for(let i=0;i<scores.length;i++){
        tot = tot + scores[i]
      }
      console.log(`합계는 ${tot} 평균은 ${Math.floor(tot/scores.length)}`)
      const fruits = ["Apple", "Banna", "Grape"]
      console.log(fruits[0]);
      console.log(fruits)
    </script>

    <li>배열의 함수( push, pop, shift, unshift, splice, slice, indexOf, icludes</li>
    <script>
      console.log("=== 배열 원소 추가, 삭제 ===")
      const stack = [1,2,3,4,5]
      console.log(stack)
      stack.push(6) // push() 마지막에 원소 추가
      console.log(stack)
      console.log(stack.pop()) // pop() 마지막 원소 제거 및 출력
      console.log(stack)
      const queue = stack;
      console.log(queue)
      queue.push(6) // push() 마지막에 원소 추가
      console.log(queue)
      console.log(queue.shift()) // shift() 맨 앞의 원소 제거 및 출력
      console.log(queue)
      console.log(queue.unshift(7)) // unshift() 맨 앞에 원소 추가
      console.log(queue)
      console.log("=== 배열 자르기, 합치기 ===")
      const arr2 = queue.slice(0,2); // 잘라내기 배열의 원소 일부 추출(원본 유지)
      console.log(arr2)
      console.log(queue)
      const arr3 = queue.splice(0,2); // 잘라내기 배열의 원소 추출(원본 갱신)
      console.log(arr3, queue)
      queue.splice(arr3)
      console.log(queue)

      console.log(arr2)
      console.log(queue)
      console.log(arr3.indexOf(3)) // 7,2만 있기 때문에 3이 없음 그래서 -1을 반환
      console.log(queue.indexOf(3)) // 7,2만 있기 때문에 3이 없음 그래서 -1을 반환
      
    </script>
  </ol>

</body>

</html>
