<body>
  <h1>배열(Array :: 같은 이름으로 여러개의 원소를 지정)</h1>
  <a href="/"><span class="material-symbols-outlined">home</span>Home</a>
  <hr>
  <p>배열은 원소에 접근할 때 index로 접근, 배열은 자체적으로 길이 값을 제공</p>
  <ol>
    <li>배열의 선언과 접근</li>
    <script>
      // 개별적으로 변수를 선언하기 매우 번거로움.
      const scoreCy = 100; const scoreMs = 100; const scoreJw = 100;

      // 하나의 이름으로 여러개의 값을 담을 수 있음.
      let scores = [88, 74, 92, 100, 99]
      let tot = 0;
      for (let i = 0; i < scores.length; i++) {
        tot = tot + scores[i]
      }
      for(let idx in scores) { // index로 접근
        console.log(idx, scores[idx])
      }
      for(let score of scores) { // 원소로 접근
        console.log(score);
      }
      console.log(`합계는 ${tot} 평균은 ${Math.floor(tot / scores.length)}`)
      const fruits = ["Apple", "Banna", "Grape"]
      console.log(fruits[0]);
      console.log(fruits)
    </script>

    <li>배열의 함수( push, pop, shift, unshift, splice, slice, indexOf, icludes )</li>
    <script>
      console.log("=== 배열 원소 추가, 삭제 ===")
      const stack = [1, 2, 3, 4, 5]
      console.log(stack)
      stack.push(6) // push() 마지막에 원소 추가
      console.log(stack)
      console.log(stack.pop()) // pop() 마지막 원소 제거 및 출력
      console.log(stack)
      const queue = stack;
      console.log(queue)
      queue.push(6) // push() 마지막에 원소 추가
      console.log(queue)
      console.log(queue.shift()) // shift() 맨 앞의 원소 제거 및 출력
      console.log(queue)
      console.log(queue.unshift(7)) // unshift() 맨 앞에 원소 추가
      console.log(queue)
      console.log("=== 배열 자르기, 합치기 ===")
      let arr1 = [10, 20, 30, 40, 50]
      const arr2 = arr1.slice(0, 2); // slice() 잘라내기 배열원소일부추출(원본유지),마지막 인자 제외
      console.log(arr2); console.log(arr1)

      const arr3 = arr1.splice(0, 2); // splice() 잘라내기 배열원소추출(원본갱신),마지막 인자 제외
      console.log("arr3:", arr3); console.log("splice() 잘라내기 후: ", arr1)

      arr1.splice(0, 0, 10, 20) // splice(인덱스, 삭제할 길이, 값1, 값2, ...) 0번째에 지우는거 없이 값들 추가
      console.log("splice() 추가 후: ", arr1)
      arr1.splice(0, 2, 1, 2)
      console.log("splice() 교체 후: ", arr1) // 1,2,30,40,50

      const arr4 = arr1.concat(arr3) // concat() 합치기
      console.log("concat() 합치기 후: ", arr4)

      console.log("=== 배열 문자열로 바꾸기 ===")
      console.log("join() 후:", arr1.join()) // 
      console.log("join() 후:", arr1.join("/"))
      console.log("toString() 후:", arr1.toString());

      console.log("=== 배열 순서 바꾸기 ===")
      let arr5 = [1, 2, 3, 4, 5]
      console.log(arr5)
      console.log("reverse() 역순 후:", arr5.reverse())
      console.log("sort() 정렬 후:", arr5.sort())
      let arr6 = [10, 2, 30, 1]
      console.log("sort() 정렬 후:", arr6.sort()) // sort() 원소를 문자열로 변경후 정렬 1,10,2,30
      arr6.sort(function (a, b) {
        return a - b; // 오름차순
        // return b-a; // 내림차순
      })
      arr6.sort((a,b) => a-b)
      console.log("sort() 정렬 후:", arr6)

      console.log("=== 배열 탐색, 존재여부 바꾸기 ===")
      let arr7 = ["a", "b", "c", "d"]
      console.log(arr7.indexOf("a"))  //0
      console.log(arr7.indexOf("z"))  //-1
      console.log(arr7.includes("x")) //false 
      console.log(arr7.find(function (item) {
        return item == 'b'
      })) // 조건에 맞는 첫 번째 값 찾기
      console.log(arr7.find(item => item=='b'))

      // findIndex() 조건에 맞는 첫 번째 index 찾기
      console.log("findIndex()", arr7.findIndex(item => item > "b")) // 2

      console.log("=== 배열 반복 처리 ===")
      // forEach(), map(), filter(), reduce(), some(), every()
      let arr10 = [10,20,30]
      // forEach :: 배열의 원소와 인덱스로 접근하는 stream
      arr10.forEach(function(item, idx){
        console.log(idx, item)
      });
      arr10.forEach( (item, idx) => console.log(idx, item))

      // map() :: 배열의 각각의 원소에 접근 후 다시 배열의 원소를 갱신할 때
      var result = arr10.map(function (item) {
        return item * 2
      })
      var result = arr10.map(item => item*2)
      console.log("map() result:",result, arr10)

      // filter() :: 배열의 조건을 걸어서 일부만 추출
      var result = arr10.filter(function (item){
        return item % 6 == 0
      })
      result = arr10.filter(item => item%6 == 0)

      console.log("filter() result:",result, arr10)

      console.log("=== 배열 평탄화 ===")
      let arr8 = [1, [2, 3], [4, 5]]
      console.log(arr8.flat()) // [1,2,3,4,5] 1 차원 배열로 평탄화
      // flatMap()

      console.log("=== 배열 확인 ===")
      console.log(Array.isArray(arr8)) // 배열 맞음 true
      console.log(Array.isArray("hello")) // 배열 아님 false

    </script>
    <li>2차원 배열</li>
    <script>
      // 2차원 배열
      let arr2d = [[1, 2, 3], [4, 5, 6]]; // 2행 3열
      console.log(arr2d);

      for (let i = 0; i < arr2d.length; i++) {
        for (let j = 0; j < arr2d[i].length; j++) {
          if (j != 0) document.write(",")
          document.write(arr2d[i][j])
        }
        document.write("<br>")
      }
    </script>
    <li>배열 구조 분해 할당(Array Destructing Assignment)</li>
    <script>
      const arr9 = [1,2,3]
      const [a,b,c] = arr9
      console.log(a, b, c)
      const [x, , z] = [10,20,30]
      console.log(x,z)
    </script>
